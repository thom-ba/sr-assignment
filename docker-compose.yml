version: "3.9"

services:
  db:
    image: postgres:17
    container_name: assignment
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "3295:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
